name: PHP checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.3']

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Check PHP syntax
        run: find . -name '*.php' -not -path './uploads/*' -not -path './.git/*' -print0 | xargs -0 -n1 php -l

      - name: Check JavaScript syntax
        run: |
          node --check assets/js/app.js
          node --check assets/js/library.js
          node --check assets/js/watch-layout.js
          node --check assets/js/player.js
          node --check assets/js/bookmarks.js

      - name: Test player progress
        run: node tests/player_progress_test.js

      - name: Test HTTP streaming
        run: python3 tests/stream_http_test.py

  bookmarks:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: test-only-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli, curl
          coverage: none
      - name: Test bookmarks with MariaDB
        env:
          BOOKMARK_DB_PASS: test-only-password
        run: python3 tests/bookmarks_http_test.py

      - name: Install ffmpeg for conversion tests
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Test local conversion and simulated CloudConvert failures
        env:
          BOOKMARK_DB_PASS: test-only-password
        run: python3 tests/conversion_test.py

      - name: Install browser test dependencies
        run: |
          npm install --prefix /tmp/qplayer-browser playwright@1.51.1 --no-audit --no-fund
          /tmp/qplayer-browser/node_modules/.bin/playwright install --with-deps chromium

      - name: Test library and player with MariaDB and Chromium
        env:
          BOOKMARK_DB_PASS: test-only-password
          LIBRARY_BROWSER_TEST: '1'
          PLAYWRIGHT_MODULE: /tmp/qplayer-browser/node_modules/playwright
        run: python3 tests/library_phase1_test.py
