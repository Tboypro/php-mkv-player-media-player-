name: PHP checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.3']

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Check PHP syntax
        run: find . -name '*.php' -not -path './uploads/*' -not -path './.git/*' -print0 | xargs -0 -n1 php -l

      - name: Check JavaScript syntax
        run: |
          node --check assets/js/app.js
          node --check assets/js/player.js

      - name: Test HTTP streaming
        run: python3 tests/stream_http_test.py
